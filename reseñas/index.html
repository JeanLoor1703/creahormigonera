    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background: #0a0a0a;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }

        /* Animated background particles */
        .bg-glow {
            position: fixed;
            inset: 0;
            z-index: 0;
            overflow: hidden;
        }

        .bg-glow::before,
        .bg-glow::after {
            content: '';
            position: absolute;
            border-radius: 50%;
            filter: blur(100px);
            opacity: 0.3;
            animation: pulse 4s ease-in-out infinite alternate;
        }

        .bg-glow::before {
            width: 400px;
            height: 400px;
            background: #1a73e8;
            top: -100px;
            left: -100px;
        }

        .bg-glow::after {
            width: 350px;
            height: 350px;
            background: #fbbc04;
            bottom: -80px;
            right: -80px;
            animation-delay: 2s;
        }

        @keyframes pulse {
            0% { transform: scale(1); opacity: 0.2; }
            100% { transform: scale(1.3); opacity: 0.4; }
        }

        /* Card */
        .card {
            position: relative;
            z-index: 1;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 48px 40px;
            max-width: 420px;
            width: 90%;
            text-align: center;
            animation: cardEntry 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            opacity: 0;
            transform: translateY(30px) scale(0.95);
        }

        @keyframes cardEntry {
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        /* Fade out animation */
        .card.fade-out {
            animation: cardExit 0.5s cubic-bezier(0.55, 0, 1, 0.45) forwards;
        }

        @keyframes cardExit {
            to {
                opacity: 0;
                transform: translateY(-20px) scale(1.02);
            }
        }

        /* Logo */
        .logo {
            width: 160px;
            margin: 0 auto 28px;
        }

        .logo img {
            width: 100%;
            height: auto;
        }

        /* Google stars */
        .stars {
            display: flex;
            justify-content: center;
            gap: 6px;
            margin-bottom: 20px;
            animation: starsIn 0.8s ease-out 0.3s forwards;
            opacity: 0;
        }

        @keyframes starsIn {
            to { opacity: 1; }
        }

        .star {
            width: 32px;
            height: 32px;
        }

        .star svg {
            width: 100%;
            height: 100%;
            fill: #fbbc04;
            filter: drop-shadow(0 0 6px rgba(251, 188, 4, 0.4));
            animation: starPop 0.3s ease-out forwards;
            opacity: 0;
            transform: scale(0);
        }

        .star:nth-child(1) svg { animation-delay: 0.4s; }
        .star:nth-child(2) svg { animation-delay: 0.5s; }
        .star:nth-child(3) svg { animation-delay: 0.6s; }
        .star:nth-child(4) svg { animation-delay: 0.7s; }
        .star:nth-child(5) svg { animation-delay: 0.8s; }

        @keyframes starPop {
            0% { opacity: 0; transform: scale(0) rotate(-20deg); }
            70% { transform: scale(1.2) rotate(5deg); }
            100% { opacity: 1; transform: scale(1) rotate(0); }
        }

        /* Text */
        h1 {
            color: #ffffff;
            font-size: 1.35rem;
            font-weight: 700;
            margin-bottom: 8px;
            animation: textIn 0.6s ease-out 0.5s forwards;
            opacity: 0;
        }

        .subtitle {
            color: rgba(255, 255, 255, 0.6);
            font-size: 0.9rem;
            line-height: 1.5;
            margin-bottom: 32px;
            animation: textIn 0.6s ease-out 0.6s forwards;
            opacity: 0;
        }

        @keyframes textIn {
            to { opacity: 1; }
        }

        /* Spinner */
        .spinner-wrap {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-bottom: 28px;
            animation: textIn 0.6s ease-out 0.7s forwards;
            opacity: 0;
        }

        .spinner {
            width: 28px;
            height: 28px;
            border: 3px solid rgba(255, 255, 255, 0.1);
            border-top-color: #1a73e8;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .spinner-text {
            color: rgba(255, 255, 255, 0.5);
            font-size: 0.8rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1.5px;
        }

        /* Progress bar */
        .progress-bar {
            width: 100%;
            height: 3px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 4px;
            overflow: hidden;
            margin-bottom: 28px;
            animation: textIn 0.6s ease-out 0.7s forwards;
            opacity: 0;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #1a73e8, #4285f4, #fbbc04);
            border-radius: 4px;
            width: 0%;
            animation: fillBar 1.8s ease-in-out 0.8s forwards;
        }

        @keyframes fillBar {
            to { width: 100%; }
        }

        /* Manual link */
        .manual-link {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: linear-gradient(135deg, #1a73e8, #4285f4);
            color: #fff;
            font-weight: 600;
            font-size: 0.9rem;
            text-decoration: none;
            padding: 14px 28px;
            border-radius: 14px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 20px rgba(26, 115, 232, 0.3);
            animation: textIn 0.6s ease-out 0.8s forwards;
            opacity: 0;
        }

        .manual-link:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(26, 115, 232, 0.5);
        }

        .manual-link svg {
            width: 18px;
            height: 18px;
            fill: currentColor;
        }

        /* Google icon */
        .google-icon {
            display: flex;
            justify-content: center;
            margin-bottom: 16px;
            animation: textIn 0.6s ease-out 0.2s forwards;
            opacity: 0;
        }

        .google-icon svg {
            width: 36px;
            height: 36px;
        }
    </style>
</head>
